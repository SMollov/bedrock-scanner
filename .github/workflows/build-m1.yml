
name: Build Nether Bedrock Cracker M1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Nether Bedrock Cracker
        uses: actions/checkout@v4
        with:
          repository: 19MisterX98/Nether_Bedrock_Cracker
          ref: gui

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build for Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package executable
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/bedrock_cracker dist/
          chmod +x dist/bedrock_cracker

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Nether-Bedrock-Cracker-M1
          path: dist/
